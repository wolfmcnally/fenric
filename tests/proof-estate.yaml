# Fenric's proof estate. Generated at methodology adoption on 2026-11-20 from this
# repository's own inventory; every family, selector, tier and risk judgment here is
# local. Governed by policies/test-suite-governance.md.
# Validate with ./bin/test-governance validate.
schema: agentic.proof_estate.v5
baseline_report: reports/test-governance/fenric-pre-reset-baseline.json
audit_ledger: reports/test-governance/fenric-reset.jsonl
witness_ledger: reports/test-governance/fenric-witnesses.jsonl
witness_failure_lines: ^E\s
adoption:
  mode: bounded
  reason: Adopted 2026-11-20 with every inherited and product proof frozen as baseline and pending review.
    Review in bounded batches on a concrete signal, starting with the remote-setup family whose fixture
    clock failed under machine load at adoption, then the methodology families when the methodology next
    changes.
hang_timeout_seconds: 1800
mutation:
  tool: null
  reason: No qualification run has been requested. cosmic-ray is locked as a development dependency so
    an operator-requested survey can run; until one kills a caught fault and reports a missed one, the
    estate reports mutation as unmeasured.
critical_risks:
  custody:
    state: applicable
    direct_proof: pytest:tests/test_check_receipt.py::test_passed_run_is_durable_and_reusable_for_exact_clean_head
  security:
    state: applicable
    direct_proof: pytest:tests/test_security.py::test_no_failure_path_leaks_a_sentinel
  authority:
    state: applicable
    direct_proof: pytest:tests/test_kickoff_evidence.py::test_change_manifest_is_candidate_bound_and_detects_authority_drift
  concurrency:
    state: applicable
    direct_proof: pytest:tests/test_execution_telemetry.py::test_concurrent_process_mutations_do_not_lose_spans
  atomicity:
    state: applicable
    direct_proof: pytest:tests/test_target.py::test_a_failure_at_any_step_leaves_the_target_whole_and_no_temporary_file
  corruption:
    state: applicable
    direct_proof: pytest:tests/test_kickoff_evidence.py::test_validate_detects_corrupt_evidence
  recovery:
    state: applicable
    direct_proof: pytest:tests/test_execution_telemetry.py::test_lifecycle_idempotency_finalization_and_crash_recovery
  public-contract:
    state: applicable
    direct_proof: pytest:tests/test_cli.py::test_a_collecting_verb_prints_json_and_a_showing_verb_prints_ok
  schema:
    state: applicable
    direct_proof: pytest:tests/test_test_governance.py::test_live_reset_validates
  core-success:
    state: applicable
    direct_proof: pytest:tests/test_check.py::test_all_is_default_locked_ordered_and_cwd_independent
  deploy:
    state: applicable
    direct_proof: pytest:tests/test_documentation.py::test_deploy_binds_clean_latest_release_and_preserves_manual_mode
