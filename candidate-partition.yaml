# Root-anchored JSON-quoted patterns; *, ? stay within a segment; ** spans segments.
# Bookkeeping carves out of active. Unclassified tracked paths refuse; unclassified
# nonignored untracked files remain included in product identity until classified.
schema: agentic.candidate-partition.v1
active:
  - "/candidate-partition.yaml"
  - "/.gitattributes"
  - "/.gitignore"
  - "/.python-version"
  - "/AGENTS.md"
  - "/CHANGELOG.md"
  - "/CONTRIBUTING.md"
  - "/LICENSE"
  - "/README.md"
  - "/RELEASING.md"
  - "/SECURITY.md"
  - "/build_assets.py"
  - "/bun.lock"
  - "/documentation.toml"
  - "/kickoff.yaml"
  - "/package-inventory.txt"
  - "/package.json"
  - "/package.py"
  - "/pyproject.toml"
  - "/tsconfig.json"
  - "/uv.lock"
  - "/.agents/**"
  - "/.claude/**"
  - "/.codex/**"
  - "/.githooks/**"
  - "/assets/**"
  - "/bin/**"
  - "/briefs/**"
  - "/collaboration/**"
  - "/docs/**"
  - "/fenric/**"
  - "/lib/**"
  - "/log/**"
  - "/manual/**"
  - "/plan/**"
  - "/policies/**"
  - "/preview/**"
  - "/reference/**"
  - "/reports/**"
  - "/tests/**"
bookkeeping:
  - "/EXECUTION_LOG.jsonl"
  - "/plan/events/**"
  - "/log/entries/**"
  - "/lessons/**"
  - "/lessons-archived/**"
  - "/user-actions/**"
  - "/user-actions-archived/**"
