[project]
name = "fenric"
version = "0.5.0"
description = "Native dialogs for agents and scripts: ask a person something, get a structured answer back."
requires-python = ">=3.11"
license = "MIT AND ISC AND BSD-3-Clause AND Unlicense"
license-files = ["LICENSE", "fenric/_assets/THIRD_PARTY_NOTICES.md"]
readme = "README.md"
authors = [{ name = "Wolf McNally" }]
keywords = ["dialog", "prompt", "gui", "agents", "cli", "webview", "secrets"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Utilities",
]
dependencies = [
    "mistune==3.4.0",
    "pywebview>=6.2.1",
]

[project.urls]
Repository = "https://github.com/wolfmcnally/fenric"
Issues = "https://github.com/wolfmcnally/fenric/issues"
Documentation = "https://github.com/wolfmcnally/fenric/tree/master/docs"
Changelog = "https://github.com/wolfmcnally/fenric/blob/master/CHANGELOG.md"

[project.scripts]
fenric = "fenric.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fenric"]

[tool.hatch.build.targets.sdist]
# The source archive carries the product only; repository methodology stays in Git.
exclude = [
    "/.agents",
    "/.claude",
    "/.codex",
    "/.githooks",
    "/.gitattributes",
    "/bin",
    "/briefs",
    "/collaboration",
    "/lib",
    "/log",
    "/plan",
    "/policies",
    "/reports",
    "/lessons",
    "/lessons-archived",
    "/user-actions",
    "/user-actions-archived",
    "/reference",
    "/manual",
    "/kickoff.yaml",
    "/candidate-partition.yaml",
    "/documentation.toml",
    "/tests/proof-estate.yaml",
    "/EXECUTION_LOG.jsonl",
    "/tests/fixtures/execution_telemetry",
    "/tests/fixtures/refactor_evaluation",
    "/tests/fixtures/kickoff_config_seed.yaml",
    "/tests/proof-plants.json",
    "/tests/render_execution_dashboard_fixture.py",
    "/tests/structured_fixtures.py",
    "/tests/test_check.py",
    "/tests/test_check_catalogs.py",
    "/tests/test_check_hooks_installed.py",
    "/tests/test_check_plan_concreteness.py",
    "/tests/test_check_plan_delivery.py",
    "/tests/test_check_receipt.py",
    "/tests/test_check_release_worktrees.py",
    "/tests/test_documentation.py",
    "/tests/test_execution_dashboard.py",
    "/tests/test_execution_telemetry.py",
    "/tests/test_install_hooks.py",
    "/tests/test_kickoff_config.py",
    "/tests/test_kickoff_control_plane.py",
    "/tests/test_kickoff_evidence.py",
    "/tests/test_kickoff_tree_id.py",
    "/tests/test_lessons.py",
    "/tests/test_log_control_plane.py",
    "/tests/test_mirror_parity.py",
    "/tests/test_multioperator.py",
    "/tests/test_mutation.py",
    "/tests/test_new_name.py",
    "/tests/test_pre_commit.py",
    "/tests/test_research_authority.py",
    "/tests/test_review_verdicts.py",
    "/tests/test_shell_syntax.py",
    "/tests/test_test_governance.py",
    "/tests/test_toolchain_callers.py",
    "/tests/test_toolchain_entrypoints.py",
    "/tests/test_treatise.py",
]

[dependency-groups]
dev = [
    "pyyaml>=6.0,<7",
    "pytest>=8.0",
    "ruff>=0.6",
    "playwright>=1.63.0",
    "hatchling>=1.27",
    "cosmic-ray>=8.7,<9",
    "pytest-xdist>=3.8,<4",
]

[tool.uv]
required-version = ">=0.9.26"
python-preference = "only-managed"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.isort]
# The preview module must not depend on an ignored generated gallery directory.
known-first-party = ["gallery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
