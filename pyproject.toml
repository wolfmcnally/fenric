[project]
name = "fenric"
version = "0.3.0"
description = "Native dialogs for agents and scripts: ask a person something, get a structured answer back."
requires-python = ">=3.11"
license = "MIT AND ISC AND BSD-3-Clause AND Unlicense"
license-files = ["LICENSE", "fenric/_assets/THIRD_PARTY_NOTICES.md"]
readme = "README.md"
authors = [{ name = "Wolf McNally" }]
keywords = ["dialog", "prompt", "gui", "agents", "cli", "webview", "secrets"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Utilities",
]
dependencies = [
    "pywebview>=6.2.1",
]

[project.urls]
Repository = "https://github.com/wolfmcnally/fenric"
Issues = "https://github.com/wolfmcnally/fenric/issues"
Documentation = "https://github.com/wolfmcnally/fenric/tree/master/docs"
Changelog = "https://github.com/wolfmcnally/fenric/blob/master/CHANGELOG.md"

[project.scripts]
fenric = "fenric.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fenric"]

[dependency-groups]
dev = [
    "pyyaml>=6.0,<7",
    "pytest>=8.0",
    "ruff>=0.6",
    "playwright>=1.63.0",
    "hatchling>=1.27",
]

[tool.uv]
required-version = ">=0.9.26"
python-preference = "only-managed"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.isort]
# The preview module must not depend on an ignored generated gallery directory.
known-first-party = ["gallery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
